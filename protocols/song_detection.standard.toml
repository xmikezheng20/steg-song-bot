[protocol]
name = "song_detection"
profile = "standard"
workflow = "bonsai/protocols/song_detection.bonsai"

[acquisition]
buffer_ms = 10

[signal_processing]
high_pass_hz = 20000
high_pass_kernel_length = 60

[song_detection]
rms_threshold = 0.01
minimum_span_ms = 1500
minimum_occupancy = 0.25
end_silence_ms = 250

[output]
save_raw_audio = false
save_block_csv = false
wav_split_minutes = 60
